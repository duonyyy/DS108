[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-comment-crawler"
version = "0.1.0"
description = "Public-comment collection workflows for Vietnamese social platforms."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "google-api-python-client>=2.0,<3",
    "langdetect>=1.0,<2",
    "playwright>=1.45,<2",
    "requests>=2.32,<3",
    "TikTokApi>=7.0,<8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["comment_crawler*", "voz_crawler_core*"]
